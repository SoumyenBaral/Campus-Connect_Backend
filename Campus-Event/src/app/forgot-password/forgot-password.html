<div class="forgot-container">
  <h2>Reset Your Password</h2>

  <form (ngSubmit)="sendResetLink()">
    <input type="email"
           placeholder="Enter your registered email"
           name="email"
           [(ngModel)]="email"
           required
           email />

    <button type="submit">Send Reset Link</button>
  </form>

  <p class="message">{{ message }}</p>
</div>
