<section>
<div class="container">
    <div class="registrationform">
        <form action="">
            <fieldset>
                <label for="Eventname">Event Name <span>*</span></label>
                <br>
                <input type="text" name="name" id="name" placeholder="Enter event name" required>
                <br>
                <br>
                <label for="date">Date</label>
                <br>
                <input type="date" name="date" id="date" placeholder="Select date">
                <br>
                <br>
                <label for="time">Time</label>
                <br>
                <input type="time" name="time" id="time" placeholder="Select time">
                <br>
                <br>
                <label for="location">Location <span>*</span></label>
                <br>
                <input type="text" name="location" id="location" placeholder="Enter your location" required>
                <br>
                <br>
                <label for="message">Description<span>*</span></label><br>
                <textarea name="message" id="message" placeholder="Ex: topics,schedule,etc" required> </textarea>
                <br>
                <br>
                <button ><b>Create Event</b></button>
            </fieldset>
        </form>
    </div>
</div>
</section>
