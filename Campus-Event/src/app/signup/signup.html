<div class="body">
    <div class="image">
        <img src="https://img.freepik.com/free-vector/login-concept-illustration_114360-739.jpg" alt="">
    </div>
    <div class="signup">
        <span>
            <h4><b>Welcome👏</b></h4>
        </span>
        <span>
            <p>Please fill out the form to register.</p>
        </span>
        <form action="/SignUp" #signupForm="ngForm" (ngSubmit)="onSubmit(signupForm)" method="POST">
            <fieldset>
                <label for="name">Name:</label>
                <br>
                <input type="text" placeholder="Enter Your First Name" name="name" [(ngModel)]="user.name" id="fname" required>
                <br>
                <br>
                <label for="email"> Email:</label>
                <br>
                <input type="email" placeholder="Enter Your Email" name="email" [(ngModel)]="user.email" id="email" required>
                <br>
                <br>
                <label for="password">Password:</label>
                <br>
                <input type="password" placeholder="Enter Your Password" name="password" [(ngModel)]="user.password" id="password" required>
                <br>
                <br>
                <label for="contact"> Phone:</label>
                <br>
                <input type="number" placeholder="Enter Your Phone Number" name="contact" [(ngModel)]="user.contact" id="contact" required>
                <br>
                <br>
                <label for="role">Role</label>
                <select id="role"  name="role" [(ngModel)]="user.role">
                    <option value="ADMIN">ADMIN</option>
                    <option value="COORDINATOR">COORDINATOR</option>
                    <option value="HOST">HOST</option>
                    <option value="STUDENT">STUDENT</option>
                </select>
                <br>
                <br>
                <button type="submit" [disabled]="!signupForm.valid">Sign up</button>


            </fieldset>
        </form>
        <br>
        <span>
            <p id="d1">Already a user?<a routerLink="/login">Login</a></p>
        </span>
    </div>
    <div>

    </div>
</div>
<router-outlet></router-outlet>
