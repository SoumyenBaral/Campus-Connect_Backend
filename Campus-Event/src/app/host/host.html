<app-navbar></app-navbar>
<div class="dashboard-container">
    <div class="c1">
        <h2><b>Welcome to CampusConnect Host!
            </b></h2>
    </div>
    <br>
    <div class="carousel-slide">
        <div id="carouselExampleInterval" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active" data-bs-interval="1000">
                    <img src="https://images.pexels.com/photos/29708258/pexels-photo-29708258.jpeg"  alt="...">
                </div>
                <div class="carousel-item" data-bs-interval="1000">
                    <img src="https://images.pexels.com/photos/4889278/pexels-photo-4889278.jpeg"  alt="...">
                </div>
                <div class="carousel-item" data-bs-interval="1000">
                    <img src="https://images.pexels.com/photos/1916816/pexels-photo-1916816.jpeg"    alt="...">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleInterval"
                data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleInterval"
                data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>
    <br>
    <div class="main-content">

        <section class="create-event-banner pink-purple">
            <span class="icon">+</span>
            <div class="banner-text">
                <a routerLink="/event"> <strong>Create New Event!</strong></a>
                <span>Start planning your next amazing event</span>
            </div>
            <span class="arrow-icon">→</span>
        </section>
        <section class="quick-actions">
            <h3><b>Quick Actions</b></h3>
            <div class="actions-grid">
                <!-- <div class="action-card pink-action">
                    <span class="icon">✉️</span>
                    <div class="action-text">
                        <h5>Total Students</h5>
                <h3>{{ counts.studentCount || 0 }}</h3>
                      
                    </div>
                </div> -->
                <div class="action-card blue-action">
                    <span class="icon">📄</span>
                    <div class="action-text">

                        <a routerLink="/host-manual">Help</a>

                    </div>
                </div>
            </div>
        </section>


    </div>
