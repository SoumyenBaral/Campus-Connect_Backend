<div class="container">
  <h2>Student Details</h2>
  <table [border]="1" cellpadding="8" cellspacing="0" style="width:100%; border-collapse:collapse;">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Contact</th>
        <th>Created At</th>
      </tr>
    </thead>
    <tbody>
        <tr *ngFor="let student of students">
        <td>{{ student.id }}</td>
        <td>{{ student.name }}</td>
        <td>{{ student.email }}</td>
        <td>{{ student.contact }}</td>
        <td>{{ student.createdAt | date:'medium' }}</td>
      </tr>
    </tbody>
  </table>
</div>
