<section>
    <div class="regis-form">

        <div style="padding: 10px;">
            <h3 class="head"><b>Event Registration</b></h3>
            
            <form action="#" method="post">
                <fieldset>
                    <legend>Registration Details</legend>
                    <h6>Please fill in your details to complete registration</h6>

                    <label for="fullName">Name:</label>
                    <input type="text" id="fullName" name="fullName" required placeholder=" Enter Your First Name" [(ngModel)]="userdata.fullName">

                    <label for="emailAddress">Email Address:</label>
                    <input type="email" id="emailAddress"name="emailAddress" placeholder="abc@gmail.com" required [(ngModel)]="userdata.emailAddress">

                    <label for="mobileNumber">Mobile Number:</label>
                    <input type="number" id="mobileNumber" name="mobileNumber" required placeholder="Enter Your Mobile Number" [(ngModel)]="userdata.mobileNumber">

                    <label for="organization">Organization/Institute/Company:</label>
                    <input type="text" id="organization" name="organization" required placeholder=" Enter Your organization" [(ngModel)]="userdata.organization">
                    <br>


                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">I agree to the <span style="text-decoration: underline;">Terms and
                                Conditions</span></label>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="updates">
                        <label for="updates">I would like to receive updates for future events.</label>
                    </div>
                    <br>
                 <button><b>Submit</b></button>
                </fieldset>
            </form>
        </div>

    </div>


</section>

<app-footer></app-footer>
